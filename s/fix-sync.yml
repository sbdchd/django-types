# ast-grep rules to fix common bare generics in synced stubs.
id: fix-callable-type
language: python
rule:
  pattern: Callable
  inside:
    kind: type
fix: Callable[..., Any]
---
id: fix-callable-typevar-bound
language: python
rule:
  all:
    - pattern: Callable
    - inside:
        stopBy: end
        pattern: TypeVar($NAME, bound=$$$)
    - not:
        inside:
          kind: generic_type
    - not:
        inside:
          stopBy: end
          pattern: Callable[$$$]
fix: Callable[..., Any]
---
id: fix-callable-union-before
language: python
rule:
  pattern: Callable
  precedes:
    pattern: "|"
fix: Callable[..., Any]
---
id: fix-callable-union-after
language: python
rule:
  pattern: Callable
  follows:
    pattern: "|"
fix: Callable[..., Any]
---
id: fix-list-union-before
language: python
rule:
  pattern: list
  precedes:
    pattern: "|"
fix: list[Any]
---
id: fix-list-union-after
language: python
rule:
  pattern: list
  follows:
    pattern: "|"
fix: list[Any]
---
id: fix-lookup-type
language: python
rule:
  pattern: Lookup
  inside:
    kind: type
fix: Lookup[Any]
---
id: fix-lookup-union-before
language: python
rule:
  pattern: Lookup
  precedes:
    pattern: "|"
fix: Lookup[Any]
---
id: fix-lookup-union-after
language: python
rule:
  pattern: Lookup
  follows:
    pattern: "|"
fix: Lookup[Any]
---
id: fix-tuple-type
language: python
rule:
  pattern: tuple
  inside:
    kind: type
fix: tuple[Any, ...]
---
id: fix-tuple-union-before
language: python
rule:
  pattern: tuple
  precedes:
    pattern: "|"
fix: tuple[Any, ...]
---
id: fix-tuple-union-after
language: python
rule:
  pattern: tuple
  follows:
    pattern: "|"
fix: tuple[Any, ...]
---
id: fix-typevar-import
language: python
rule:
  pattern: from typing_extensions import TypeVar
fix: from typing import TypeVar
