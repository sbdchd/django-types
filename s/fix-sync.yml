# ast-grep rules to fix bare Callable -> Callable[..., Any]
# and bare tuple -> tuple[Any, ...]
id: fix-callable-simple
language: python
rule:
  pattern: "$NAME: Callable"
fix: "$NAME: Callable[..., Any]"
---
id: fix-callable-union-before
language: python
rule:
  pattern: Callable
  precedes:
    pattern: "|"
fix: Callable[..., Any]
---
id: fix-callable-union-after
language: python
rule:
  pattern: Callable
  follows:
    pattern: "|"
fix: Callable[..., Any]
---
id: fix-tuple-type
language: python
rule:
  pattern: tuple
  inside:
    kind: type
fix: tuple[Any, ...]
---
id: fix-tuple-union-before
language: python
rule:
  pattern: tuple
  precedes:
    pattern: "|"
fix: tuple[Any, ...]
---
id: fix-tuple-union-after
language: python
rule:
  pattern: tuple
  follows:
    pattern: "|"
fix: tuple[Any, ...]
---
id: fix-typevar-import
language: python
rule:
  pattern: from typing_extensions import TypeVar
fix: from typing import TypeVar
